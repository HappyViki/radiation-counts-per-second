<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radiation Viewer</title>
    <style>
        :root {
            --primary-color: #0076c0;
            --primary-border: 1px solid #0076c0;
        }
        h1 {
            text-align: center;
            color: var(--primary-color);
        }
        body {
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
        .content {
            max-width: 300px;
            margin: auto;
        }
        .statItems {
            display: none;
            border: var(--primary-border);
            /* single stat items already have a bottom border */
            border-bottom: none;
        }
        .statItem {
            display: flex;
            border-bottom: var(--primary-border);
        }
        .statItem:nth-child(even) {
            color: #fff;
            background-color: var(--primary-color);
        }
        .statItem .label {
            padding: 0 4px;
            margin-right: 4px;
        }
    </style>
</head>
<body>
    <!-- New reading will be submitted every second. -->
    <div class="content">
        <h1>Counts Per Second</h1>
        <div class="message"></div>
        <div class="statItems">
            <div class="statItem">
                <div class="label">Total:</div>
                <div id="numberOfReadings"></div>
            </div>
            <div class="statItem">
                <div class="label">Min:</div>
                <div id="minCps"></div>
            </div>
            <div class="statItem">
                <div class="label">Max:</div>
                <div id="maxCps"></div>
            </div>
            <div class="statItem">
                <div class="label">Sum:</div>
                <div id="sumOfReadings"></div>
            </div>
            <div class="statItem">
                <div class="label">First at </div>
                <div id="firstTimestamp"></div>
            </div>
            <div class="statItem">
                <div class="label">Last at </div>
                <div id="lastTimestamp"></div>
            </div>
        </div>
    </div>

    <script src="./data/cpsStatsVariable.js"></script>
    <script>
        try {
            for (stat in stats) {
                document.getElementById(stat).textContent = stats[stat];
            }
            document.querySelector('.statItems').style.display = "block";
        } catch {
            document.querySelector('.message').textContent = "No stats found."
        }
    </script>
</body>
</html>
